# XcodeGen spec: CI runs `xcodegen generate` to make FrameCraft.xcodeproj (the project file isn't committed).
name: FrameCraft
options:
  bundleIdPrefix: com.smokerzew
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FrameCraft:
    type: application
    platform: iOS
    sources: [FrameCraft]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smokerzew.FrameCraft
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FrameCraft
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSCameraUsageDescription: FrameCraft uses the camera to take photos and to analyze the scene for framing suggestions. Nothing leaves your iPhone.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: FrameCraft adds photos to your library only when you choose Save to Photos.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MTLLINKER_FLAGS: "-framework CoreImage"
  FrameCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FrameCraftTests]
    dependencies:
      - target: FrameCraft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.smokerzew.FrameCraftTests
schemes:
  FrameCraft:
    build:
      targets:
        FrameCraft: all
        FrameCraftTests: [test]
    test:
      targets: [FrameCraftTests]
